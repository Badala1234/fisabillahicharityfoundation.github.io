<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gallery | Fisabilillahi Charity Foundation</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#f5f7f6;
  color:#222;
}

header{
  background:white;
  border-bottom:4px solid #d4af37;
  padding:18px 5%;
}

.header{
  max-width:1100px;
  margin:auto;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  font-size:22px;
  font-weight:bold;
  color:#087443;
}

.logo span{
  color:#d4af37;
}

.menu{
  background:#087443;
  color:white;
  border:0;
  padding:10px 14px;
  border-radius:7px;
  font-size:22px;
  cursor:pointer;
}

nav{
  display:flex;
  gap:8px;
}

nav a{
  color:#222;
  text-decoration:none;
  padding:8px 10px;
  font-weight:bold;
}

nav a:hover,
nav a.active{
  color:#087443;
}

.hero{
  background:#087443;
  color:white;
  text-align:center;
  padding:55px 20px;
}

.hero h1{
  font-size:42px;
  margin-bottom:10px;
}

.hero p{
  font-size:18px;
}

.container{
  width:94%;
  max-width:1100px;
  margin:auto;
}

.section{
  padding:45px 0;
}

.title{
  text-align:center;
  color:#087443;
  font-size:30px;
  margin-bottom:10px;
}

.intro{
  text-align:center;
  color:#666;
  margin-bottom:35px;
}

.gallery{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:18px;
}

.card{
  background:white;
  border-radius:10px;
  overflow:hidden;
  border:1px solid #ddd;
}

.card img{
  width:100%;
  height:240px;
  object-fit:cover;
  display:block;
}

.card h2{
  color:#087443;
  font-size:18px;
  padding:14px 14px 5px;
}

.card p{
  color:#666;
  font-size:14px;
  padding:0 14px 16px;
}

.support{
  background:#fffdf3;
  text-align:center;
  padding:45px 20px;
  border-top:1px solid #e6d58c;
}

.support h2{
  color:#087443;
  margin-bottom:10px;
}

.support p{
  color:#666;
  margin-bottom:20px;
}

.button{
  display:inline-block;
  background:#087443;
  color:white;
  text-decoration:none;
  padding:13px 25px;
  border-radius:7px;
  font-weight:bold;
}

footer{
  background:#063b24;
  color:white;
  text-align:center;
  padding:25px 15px;
}

footer p{
  font-size:14px;
  color:#d9e8df;
}

@media(max-width:800px){

  nav{
    display:none;
    position:absolute;
    top:75px;
    left:0;
    right:0;
    background:white;
    flex-direction:column;
    padding:15px 5%;
    border-bottom:3px solid #d4af37;
  }

  nav.show{
    display:flex;
  }

  nav a{
    text-align:center;
    padding:12px;
  }

  .gallery{
    grid-template-columns:repeat(2,1fr);
  }

  .hero h1{
    font-size:34px;
  }
}

@media(max-width:550px){

  .logo{
    font-size:17px;
  }

  .gallery{
    grid-template-columns:1fr;
  }

  .card img{
    height:260px;
  }

  .hero{
    padding:45px 15px;
  }

  .hero h1{
    font-size:30px;
  }
}
</style>
</head>
