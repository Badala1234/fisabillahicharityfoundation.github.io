<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Gallery | Fisabilillahi Charity Foundation</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f8f6;
      color: #222;
      line-height: 1.6;
    }

    a {
      text-decoration: none;
    }

    header {
      background: #fff;
      border-bottom: 3px solid #d4af37;
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .nav {
      width: 94%;
      max-width: 1150px;
      min-height: 72px;
      margin: auto;

      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      color: #087443;
      font-size: 20px;
      font-weight: bold;
    }

    .logo span {
      color: #d4af37;
    }

    nav {
      display: flex;
      gap: 5px;
    }

    nav a {
      color: #222;
      padding: 9px 10px;
      font-weight: bold;
      border-radius: 6px;
    }

    nav a:hover,
    nav a.active {
      background: #edf7f2;
      color: #087443;
    }

    .menu {
      display: none;
      border: none;
      background: #087443;
      color: #fff;
      font-size: 22px;
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
    }

    .hero {
      background: #087443;
      color: #fff;
      text-align: center;
      padding: 60px 20px;
    }

    .hero h1 {
      font-size: 42px;
      margin-bottom: 10px;
    }

    .hero p {
      max-width: 750px;
      margin: auto;
      color: #edf7f2;
    }

    .container {
      width: 94%;
      max-width: 1100px;
      margin: auto;
    }

    .section {
      padding: 50px 0;
    }

    .title {
      text-align: center;
      color: #087443;
      font-size: 30px;
      margin-bottom: 10px;
    }

    .intro {
      text-align: center;
      color: #666;
      max-width: 750px;
      margin: 0 auto 35px;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
    }

    .gallery-item {
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 12px;
      overflow: hidden;
    }

    .gallery-item img {
      width: 100%;
      height: 240px;
      object-fit: cover;
      display: block;
      background: #e9efeb;
    }

    .caption {
      padding: 14px;
    }
