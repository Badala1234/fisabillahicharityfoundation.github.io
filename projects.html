<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Projects | Fisabilillahi Charity Foundation</title>

  <meta
    name="description"
    content="Explore the humanitarian projects and programs of Fisabilillahi Charity Foundation."
  >

  <style>
    :root {
      --green: #087443;
      --dark-green: #045c34;
      --gold: #d4af37;
      --white: #ffffff;
      --light: #f5f8f6;
      --text: #222222;
      --muted: #666666;
      --border: #dddddd;
      --blue: #1877f2;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: var(--light);
      color: var(--text);
      line-height: 1.6;
    }

    a {
      text-decoration: none;
    }

    /* HEADER */

    header {
      background: var(--white);
      border-bottom: 3px solid var(--gold);
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .nav-container {
      width: 94%;
      max-width: 1150px;
      min-height: 75px;
      margin: auto;

      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      color: var(--green);
      font-size: 20px;
      font-weight: 800;
    }

    .logo span {
      color: var(--gold);
    }

    nav {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    nav a {
      color: var(--text);
      padding: 10px;
      border-radius: 7px;
      font-weight: 600;
    }

    nav a:hover,
    nav a.active {
      background: #edf7f2;
      color: var(--green);
    }

    .menu-btn {
      display: none;
      border: 0;
      background: var(--green);
      color: white;
      padding: 9px 13px;
      border-radius: 7px;
      font-size: 22px;
      cursor: pointer;
    }

    /* HERO */

    .hero {
      background: var(--green);
      color: white;
      text-align: center;
      padding: 65px 20px;
    }

    .hero h1 {
      font-size: 42px;
      margin-bottom: 12px;
    }

    .hero p {
      max-width: 750px;
      margin: auto;
      color: #edf7f2;
    }

    /* MAIN */

    .container {
      width: 94%;
      max-width: 1100px;
      margin: auto;
    }

    .section {
      padding: 55px 0;
    }

    .section-title {
      text-align: center;
      color: var(--green);
      font-size: 30px;
      margin-bottom: 12px;
    }

    .intro {
      max-width: 760px;
      margin: 0 auto 38px;
      text-align: center;
      color: var(--muted);
    }

    /* PROJECT GRID */

    .project-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 22px;
    }

    .project-card {
      background: white;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 28px;

      transition: transform 0.2s ease,
                  box-shadow 0.2s ease;
    }

    .project-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
    }

    .project-icon {
      width: 60px;
      height: 60px;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #edf7f2;
      border-radius: 50%;

      font-size: 28px;

      margin-bottom: 17px;
    }

    .project-card h2 {
      color: var(--green);
      font-size: 22px;
      margin-bottom: 10px;
    }

    .project-card p {
      color: var(--muted);
      font-size: 15px;
    }

    /* FUTURE PROJECTS */

    .future {
      margin-top: 45px;
      background: white;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 30px;
      text-align: center;
    }

    .future h2 {
      color: var(--green);
      margin-bottom: 10px;
    }

    .future p {
      color: var(--muted);
      max-width: 750px;
      margin: auto;
    }
